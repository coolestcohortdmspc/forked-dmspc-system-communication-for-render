{% extends 'ngRadar_Website/base.html' %}
{% load static %}
{% block title %}Home{% endblock %}

{% block content %}

<!-- Row 1: Header / Live Clock -->
<div class="container text-center mb-4">
    <div class="fs-5">
        <strong style="font-weight: 700 !important;">Current Time in UTC:</strong> <span id="live-clock"></span>
    </div>
</div>
  

<!-- Row 2: Obs Status & Input Waveform -->
<div class="row justify-content-center g-3 mb-4">
    <!-- Obs Status -->
    <div
        id="status"
        class="col-12 col-md-6 col-lg-5"
        hx-get="{% url 'status' %}"
        hx-trigger="load, statusChanged from:body"
        hx-swap="innerHTML">
    </div>
      
    <!-- Input Waveform -->
    <div class="col-12 col-md-6 col-lg-5">
        <div class="border rounded p-3 bg-white d-flex align-items-center" style="min-height: 5rem;">
            <form action="{% url 'submit_waveform' %}" method="POST" class="d-flex align-items-center w-100 gap-2">
                {% csrf_token %}
                <label class="mb-0 fw-bold" for="waveform" style="white-space:nowrap;">
                    Input waveform here:  
                </label>
                <select name="waveform" class="form-select" style="max-width: 180px;">
                    <option value="W45" {% if current_waveform == "W45" %}selected{% endif %}>W45</option>
                    <option value="W46" {% if current_waveform == "W46" %}selected{% endif %}>W46</option>
                    <option value="W47" {% if current_waveform == "W47" %}selected{% endif %}>W47</option>
                    <option value="W48" {% if current_waveform == "W48" %}selected{% endif %}>W48</option>
                    <option value="W49" {% if current_waveform == "W49" %}selected{% endif %}>W49</option>
                    <option value="W50" {% if current_waveform == "W50" %}selected{% endif %}>W50</option>
                    <option value="W51" {% if current_waveform == "W51" %}selected{% endif %}>W51</option>
                    <option value="W52" {% if current_waveform == "W52" %}selected{% endif %}>W52</option>
                    <option value="W53" {% if current_waveform == "W53" %}selected{% endif %}>W53</option>
                    <option value="W54" {% if current_waveform == "W54" %}selected{% endif %}>W54</option>
                    <option value="W55" {% if current_waveform == "W55" %}selected{% endif %}>W55</option>
                </select>
                <button type="submit" class="btn btn-primary" id="waveform-submit-btn">Submit</button>
            </form>
        </div>
    </div>
</div>

<!-- GBT -->
<div
    id="home-gbt-partial"
    class="w-100 mb-4"
    hx-get="{% url 'gbt_events' %}"
    hx-trigger="load, gbtChanged from:body"
    hx-swap="innerHTML">
</div>


<!-- Progress -->
<div
    id="progress_bar_partial"
    class="w-100 mb-4">
    {% include 'ngRadar_Website/partials/progress_bar_partial.html' %}
</div>


<!-- DSOC -->
<div
    id="home-dsoc-partial"
    class="w-100"
    hx-get="{% url 'dsoc_events' %}"
    hx-trigger="load, dsocChanged from:body"
    hx-swap="innerHTML">
</div>

<script>
    window.addEventListener(
        "pageshow",
        function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        }
    );
</script>

{% endblock %}


{% block scripts %}

<script src="{% static 'ngRadar_Website/js/home_live_clock_script.js' %}"></script>
<script src="{% static 'ngRadar_Website/js/home_events.js' %}"></script>

{% endblock %}
