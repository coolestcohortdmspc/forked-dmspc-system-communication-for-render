# ===========================================================================
# We use 1 Dockerfile and 1 docker-compose.yml file to build and 
# run the Django application in a containerized environment.
# Currently only configured to work across droplets. Will not work correctly fully local.
# ===========================================================================


#==========================
# UI + DB containers:
#==========================

services:

  portainer: # only run on dsoc droplet
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      # - "9000:9000"
      # - "9443:9443"
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data


  portainer_agent: # only run on remote machines: gbt and vlba
    image: portainer/agent:latest
    container_name: portainer_agent
    security_opt:
      - no-new-privileges:true
    # environment:
    #   # Optional: Restrict agent access to your Portainer Server IP for security
    #   - AGENT_SECRET=your_optional_secret_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "9001:9001"
    restart: always


# DSOC droplet only traefik container
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    networks:
     # Connect to the 'traefik_proxy' overlay network for inter-container communication across nodes
      # - proxy
      proxy:
        aliases:
          - traefik-metrics # using an alias here so prometheus won't care if local or droplet traefik container is running

    ports:
      - "80:80" # website HTTP
      - "443:443" # website HTTPS
      - "127.0.0.1:8080:8080" # Dashboard
      - "5432:5432" # postgres
      - "9092:9092" # kafka broker
      - "4004:4004" # etransfer command port
      - "8008:8008/udp" # etransfer data port

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./letsencrypt:/letsencrypt

    command:
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.postgres.address=:5432"
      - "--entrypoints.kafka.address=:9092"
      - "--entrypoints.etransfer-command.address=:4004"
      - "--entrypoints.etransfer-data.address=:8008/udp"

      # Dedicated Prometheus metrics endpoint
      - "--entrypoints.metrics.address=:8082"

      # Optional redirect HTTP to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure" 
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

      # Docker providers 
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"

      # Let's Encrypt / ACME
      # - "--certificatesresolvers.le.acme.email=${COHORT_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json" 
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      
      # API & Dashboard 
      - "--api.dashboard=true"
      - "--api.insecure=true"

      # Observability 
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--metrics.prometheus=true"

      # Prometheus
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--metrics.prometheus.addrouterslabels=true"

  # Traefik Dynamic configuration via Docker labels
    labels:
      # Enable self‑routing
      - "traefik.enable=true"

      # Dashboard router
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.docker.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"

# Local dev traefik container
  traefik_http:
    image: traefik:v3.7
    container_name: traefik_http
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    networks:
      # Local bridge network used by Traefik to reach
      # the Django container on the DSOC Droplet.
      # - proxy
      proxy:
        aliases:
          - traefik-metrics # using an alias here so prometheus won't care if local or droplet traefik container is running

    ports:
      - "80:80" # website HTTP
      - "127.0.0.1:8080:8080" # dashboard
      - "5432:5432" # postgres
      - "9092:9092" # kafka broker
      - "4004:4004" # etransfer command port
      - "8008:8008/udp" # etransfer data port

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.postgres.address=:5432"
      - "--entrypoints.kafka.address=:9092"
      - "--entrypoints.etransfer-command.address=:4004"
      - "--entrypoints.etransfer-data.address=:8008/udp"

      # Dedicated Prometheus metrics endpoint
      - "--entrypoints.metrics.address=:8082"

      # Providers 
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"

      # API & Dashboard 
      - "--api.dashboard=true"
      - "--api.insecure=true"

      # Observability 
      - "--log.level=INFO"
      - "--accesslog=true"

      # Prometheus
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--metrics.prometheus.addrouterslabels=true"

  # Traefik Dynamic configuration via Docker labels
    labels:
      # Enable self‑routing
      - "traefik.enable=true"

      # Dashboard router
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.docker.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"


  prometheus:
    image: prom/prometheus:latest # I feel like we should pin a specific version? Rather than the latest?
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - proxy
      - ngradar_website_network # Giving prometheus access to both networks for metrics monitoring

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - proxy
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus


  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest # we should have a pinned version eventually, I feel
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${DATABASE_URL}
    networks:
      - ngradar_website_network
    depends_on:
      postgres:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    restart: unless-stopped
    profiles: ["kafka"]
    command:
      - "--kafka.server=kafka-broker:29092"
      - "--topic.exclude=^__.*"
      - "--refresh.metadata=15s"
    depends_on:
      kafka-broker:
        condition: service_healthy
    networks:
      - ngradar_website_network


  ngradar_website:
    container_name: ngradar_website
    build:
      context: .
      target: app
    env_file:
      - .env
    depends_on:
      postgres:
          condition: service_healthy
    volumes:
      - .:/service
    # ports:
    #   - 8000:8000
    networks:
      - ngradar_website_network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Tells Traefik to route public requests matching your domain/IP to this container
      - "traefik.http.routers.ngradar_website.rule=Host(`${WEBSITE_DOMAIN_NAME}`)"
      - "traefik.http.routers.ngradar_website.entrypoints=${HTTP_ENTRYPOINT:-web}" 
      - "traefik.http.routers.ngradar_website.service=ngradar_website"
      - "traefik.http.routers.ngradar_website.tls=${TLS:-false}" #false when local, true on droplet
      - "${CERTRESOLVER}" # reads dummy label when local, and certificate resolver when deployed on droplets with HTTPS

      # Optional: Explicitly tell Traefik which port your web app container listens on internally
      - "traefik.http.services.ngradar_website.loadbalancer.server.port=8000"
    stdin_open: true
    tty: true
    command:
      - python
      - manage.py
      - runserver
      - 0.0.0.0:8000


  postgres:
    container_name: postgres
    image: postgres:18-alpine
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
    # ports:
    #   # - ${WEBSITE_DOMAIN}:5432:5432
    #   - "${PUBLIC_BIND_IP:-127.0.0.1}:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - ngradar_website_network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.tcp.routers.postgres.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.postgres.entrypoints=postgres"
      - "traefik.tcp.routers.postgres.service=postgres"

      # PostgreSQL's internal container port
      - "traefik.tcp.services.postgres.loadbalancer.server.port=5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # staging_loader:
  #   container_name: staging_loader
  #   build:
  #     context: .
  #     target: load-staging-data
  #   env_file:
  #     - .env
  #   networks:
  #     - ngradar_website_network
  #   depends_on:
  #     - postgres
  #   volumes:
  #     - staging_dump:/dump
  #   profiles:
  #     - tools

#==========================
# kafka related containers:
#==========================

  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:7.5.1
    profiles: ["kafka"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ngradar_website_network



# A one-shot init service that creates the Kafka topics after the broker is healthy
  kafka-init:
    container_name: kafka-init
    image: confluentinc/cp-kafka:7.5.1
    depends_on:
      kafka-broker:
        condition: service_healthy
    profiles: ["kafka"]
    networks:
      - ngradar_website_network
    entrypoint:
    - /bin/sh
    - -ec
    - |
      echo "Creating Kafka topics..."

      kafka-topics --bootstrap-server kafka-broker:29092 \
        --create --if-not-exists \
        --topic user_input \
        --partitions 3 \
        --replication-factor 1

      kafka-topics --bootstrap-server kafka-broker:29092 \
        --create --if-not-exists \
        --topic GBT_data \
        --partitions 3 \
        --replication-factor 1

      kafka-topics --bootstrap-server kafka-broker:29092 \
        --create --if-not-exists \
        --topic VLBA_notif \
        --partitions 3 \
        --replication-factor 1

      kafka-topics --bootstrap-server kafka-broker:29092 \
        --create --if-not-exists \
        --topic DSOC_notif \
        --partitions 3 \
        --replication-factor 1

      echo "Kafka topic initialization complete."
    restart: "no"



# Commenting this out because we don't need it for local dev and we won't need it for the droplets on DO either.
# But keeping it in case we ever do need ngrok again at some point?
