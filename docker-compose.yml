  kafka-broker:
    container_name: kafka-broker
    user: "0:0"
    image: confluentinc/cp-kafka:7.5.1
    profiles: ["kafka"]
    depends_on:
      - zookeeper
    volumes:
       - ./jmx-exporter:/opt/jmx-exporter:ro
    # ports:
    #   - ${PUBLIC_BIND_IP:-127.0.0.1}:9092:9092
    environment:
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      # KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker:29092,EXTERNAL://${WEBSITE_DOMAIN}:9092
      # KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_OPTS: >-
        -javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent-1.6.0.jar=7071:/opt/jmx-exporter/kafka.yml
    networks:
      - ngradar_website_network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.tcp.routers.kafka.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.kafka.entrypoints=kafka"
      - "traefik.tcp.routers.kafka.service=kafka"

      # Kafka's internal container port
      - "traefik.tcp.services.kafka.loadbalancer.server.port=9092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "KAFKA_OPTS='' kafka-topics --bootstrap-server kafka-broker:29092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    profiles: ["kafka"]
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:29092
    depends_on:
      - kafka-broker
    networks:
      - ngradar_website_network




#==========================
# sim containers:
#==========================

  gbt:
    container_name: gbt
    build:
      context: .
      target: base
    env_file:
      - .env
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   kafka-broker:
    #     condition: service_healthy
    #   kafka-init:
    #     condition: service_completed_successfully
    volumes:
      - .:/service
    networks:
      - ngradar_website_network
    profiles: ["kafka"]
    environment:
      # BOOTSTRAP_SERVER: ${WEBSITE_DOMAIN}:9092
      BOOTSTRAP_SERVER: ${BOOTSTRAP_SERVER:-kafka-broker:29092}
    entrypoint:
        - python
        - manage.py
        - gbt_sim



  dsoc:
    container_name: dsoc
    build:
      context: .
      target: base
    env_file:
      - .env
    depends_on:
      dsoc-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
    volumes:
      - .:/service
      - dsoc_transfer:/dsoc/incoming 
    networks:
      - ngradar_website_network
    profiles: ["kafka"]
    environment:
      # BOOTSTRAP_SERVER: kafka-broker:29092
      BOOTSTRAP_SERVER: ${BOOTSTRAP_SERVER:-kafka-broker:29092}
    entrypoint:
        - python
        - manage.py
        - dsoc_sim
  

  

  vlba:
    container_name: vlba
    build:
      context: .
      target: etc
    env_file:
      - .env
    volumes:
      - .:/service
      - vlba_data:/raw_data
    networks:
      - ngradar_website_network
    profiles: ["kafka"]
    environment:
      BOOTSTRAP_SERVER: ${BOOTSTRAP_SERVER:-kafka-broker:29092}
      ETD_HOST: ${ETD_HOST}
      ETD_COMMAND_PORT: ${ETD_COMMAND_PORT:-4004}
    entrypoint:
